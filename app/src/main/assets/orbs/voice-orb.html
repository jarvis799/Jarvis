<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Voice Orb Complete Preview</title>
<style>
  :root {
    color-scheme: dark;
    --bg: transparent;
    --ink: #eaffd6;
    --mute: #c3e39a;
  }
  body {
      background-color: transparent;
      overflow: hidden;
    color: var(--ink);
    font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    overflow: hidden;
  }
  .min-h-screen{min-height:100vh}.flex{display:flex}.flex-col{flex-direction:column}.items-center{align-items:center}.justify-center{justify-content:center}.p-6{padding:1.5rem}.select-none{user-select:none;-webkit-user-select:none}.w-full{width:100%}.max-w-lg{max-width:32rem}.my-auto{margin-top:auto;margin-bottom:auto}
  voice-orb {
    display: block;
    width: 100%;
    max-width: 480px;
    margin: 0 auto;
    cursor: pointer;
  }
</style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-6 select-none">

  <main class="w-full max-w-lg flex flex-col items-center justify-center my-auto">
    <voice-orb id="orb" state="idle" density="1.2"></voice-orb>
  </main>

  <script>
  (() => {
    if (customElements.get('voice-orb')) return;
    const STATES = ['idle', 'listening', 'thinking', 'speaking'];
    const clamp = (v, lo=0, hi=1) => Math.max(lo, Math.min(hi, Number.isFinite(+v) ? +v : lo));
    const weightsFor = state => STATES.map(s => +(s === state));
    const seeded = i => { const s = Math.sin(i*127.1+311.7)*43758.5453; return s-Math.floor(s); };
    const sphere = count => {
      const data = new Float32Array(count*4);
      const jitter = .55 / Math.sqrt(count);
      for (let i=0; i<count; i++) {
        const y = clamp(1-2*(i+.5)/count+(seeded(i+7)-.5)*jitter, -.99999, .99999);
        const a = i*2.399963229728653+(seeded(i+19)-.5)*jitter*5;
        const r = Math.sqrt(1-y*y);
        data.set([r*Math.cos(a), y, r*Math.sin(a), seeded(i+31)], i*4);
      }
      return data;
    };

    const VS = `
      precision highp float;
      attribute vec4 seed;
      uniform float time, pixels, density, onset, reduced;
      uniform vec4 weights;
      uniform vec3 bands;
      varying vec3 tint;
      varying float strength, spark;
      float hash(vec3 p) { return fract(sin(dot(p,vec3(127.1,311.7,74.7)))*43758.5453); }
      float noise(vec3 p) {
        vec3 i=floor(p), f=fract(p); f=f*f*(3.0-2.0*f);
        float a=mix(hash(i),hash(i+vec3(1,0,0)),f.x);
        float b=mix(hash(i+vec3(0,1,0)),hash(i+vec3(1,1,0)),f.x);
        float c=mix(hash(i+vec3(0,0,1)),hash(i+vec3(1,0,1)),f.x);
        float d=mix(hash(i+vec3(0,1,1)),hash(i+vec3(1,1,1)),f.x);
        return mix(mix(a,b,f.y),mix(c,d,f.y),f.z)*2.0-1.0;
      }
      vec3 turn(vec3 p,float a) { float c=cos(a),s=sin(a);return vec3(c*p.x+s*p.z,p.y,c*p.z-s*p.x); }
      void main() {
        float t=time;
        vec3 n=seed.xyz;
        float angle=acos(clamp(n.z,-1.0,1.0));
        float drift=noise(n*2.7+vec3(t*.19,-t*.11,t*.08));
        float bass=noise(n*1.8+vec3(t*.32,0,-t*.2));
        float grain=noise(n*17.0+vec3(-t*1.8,t*.7,t));
        float low=bands.x, mid=bands.y, high=bands.z;
        float idleR=1.0+.018*drift+.008*sin(t*.85);
        float inward=sin(angle*13.0+t*5.4+drift*1.6);
        float outward=sin(angle*12.0-t*6.2+drift*1.6);
        float listenR=1.0-.045*low+.10*low*bass+(.018+.12*mid)*inward+.032*high*grain;
        float speakR=1.0+.065*low+.16*low*bass+(.018+.16*mid)*outward+.055*high*grain;
        speakR+=onset*(.08+.18*max(0.0,outward))*(.4+.6*seed.w);
        float twist=t*.55+n.y*1.45+drift*.12;
        vec3 thought=turn(n,twist)*(1.0+.035*drift);
        thought.y*=.92;
        vec3 pos=turn(n,t*.11)*idleR*weights.x;
        pos+=turn(n,t*.16)*listenR*weights.y;
        pos+=thought*weights.z;
        pos+=turn(n,t*.20)*speakR*weights.w;
        float active=weights.y+weights.w;
        float rim=pow(max(0.0,1.0-abs(n.z)),2.2);
        float pop=pow(max(0.0,sin(t*8.0+seed.w*149.0)),18.0)*step(.90,seed.w);
        pos*=1.0+active*high*pop*.17;
        vec3 q=turn(n,t*.33);
        float b1=exp(-pow((dot(q,normalize(vec3(.24,.83,.50)))-.13)*23.0,2.0));
        float b2=exp(-pow((dot(q,normalize(vec3(-.71,.48,.39)))+.16)*23.0,2.0));
        float b3=exp(-pow((dot(q,normalize(vec3(.69,.58,-.41)))-.06)*23.0,2.0));
        float belts=min(1.5,b1+b2+b3)*(.6+.4*sin(atan(n.y,n.x)*2.0-t*2.3));
        float flow=pow(.5+.5*sin(angle*13.0+(weights.y-weights.w)*t*5.8+drift*2.0),7.0);
        float depth=clamp((pos.z+1.35)/2.7,0.0,1.0);
        float perspective=3.8/(3.8-pos.z*.60);
        gl_Position=vec4(pos.xy*perspective*.61,0,1);
        float point=(2.8+2.5*depth+1.2*rim)*density;
        point+=active*high*pop*1.8;
        gl_PointSize=max(2.4,point*pixels/720.0);
        float cool=.5+.5*sin(n.y*2.1+n.x*1.6+drift*.65);
        vec3 ci=mix(vec3(.20,.44,.22),vec3(.45,.68,.30),cool);
        vec3 cl=mix(vec3(.55,.92,.22),vec3(.78,1.0,.44),cool);
        vec3 cs=mix(vec3(.36,.66,.20),vec3(.66,.90,.34),cool);
        vec3 cp=mix(vec3(.16,.88,.52),vec3(.40,1.0,.72),cool);
        tint=ci*weights.x+cl*weights.y+cs*weights.z+cp*weights.w;
        tint+=belts*(vec3(.66,1.0,.32)*weights.y+vec3(.20,.96,.60)*weights.w);
        strength=(.44+.74*depth)*(.78+.3*rim)+flow*active*.55;
        spark=pop*active*high*1.6;
      }
    `;

    const FS = `
      precision highp float;
      varying vec3 tint;
      varying float strength, spark;
      void main() {
        vec2 uv=gl_PointCoord-0.5;
        float r=dot(uv,uv);
        if(r>0.25) discard;
        float core=smoothstep(0.25,0.0,r);
        vec3 col=tint*strength*1.35+vec3(1.0,0.98,0.86)*spark*core;
        gl_FragColor=vec4(col*core,core);
      }
    `;

    const CSS = `
      :host { display:block; width:100%; position:relative; aspect-ratio:1; contain:layout paint; }
      canvas { width:100%; height:100%; display:block; }
    `;

    class VoiceOrb extends HTMLElement {
      static get observedAttributes() { return ['state', 'density']; }

      connectedCallback() {
        if (!this.shadowRoot) {
          this.attachShadow({mode:'open'}).innerHTML = `<style>${CSS}</style><canvas></canvas>`;
          this.canvas = this.shadowRoot.querySelector('canvas');
          this.initGL();
        }
        this.time = 0;
        this.last = performance.now();
        this.weights = weightsFor(this.state);
        this.targetWeights = [...this.weights];
        this.bands = [0.2, 0.1, 0.1];
        this.onset = 0;
        
        this.resize = () => {
          const rect = this.getBoundingClientRect();
          const dpr = Math.min(devicePixelRatio || 1, 2);
          this.canvas.width = Math.round(rect.width * dpr);
          this.canvas.height = Math.round(rect.height * dpr);
          if (this.gl) this.gl.viewport(0, 0, this.canvas.width, this.canvas.height);
        };
        this.observer = new ResizeObserver(this.resize);
        this.observer.observe(this);
        this.resize();

        this.startLoop();
      }

      disconnectedCallback() {
        cancelAnimationFrame(this.frame);
        this.observer?.disconnect();
        this.stopAudio?.();
      }

      get state() {
        const v = this.getAttribute('state');
        return STATES.includes(v) ? v : 'idle';
      }
      set state(v) { this.setAttribute('state', v); }

      attributeChangedCallback(name, oldVal, newVal) {
        if (name === 'state') {
          this.targetWeights = weightsFor(this.state);
        }
      }

      initGL() {
        const gl = this.canvas.getContext('webgl', {alpha: true, premultipliedAlpha: false, antialias: false});
        if (!gl) return;
        this.gl = gl;
        
        const sh = (type, src) => {
          const s = gl.createShader(type);
          gl.shaderSource(s, src);
          gl.compileShader(s);
          return s;
        };

        const prog = gl.createProgram();
        gl.attachShader(prog, sh(gl.VERTEX_SHADER, VS));
        gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, FS));
        gl.linkProgram(prog);
        gl.useProgram(prog);
        this.prog = prog;

        const count = 12000;
        const data = sphere(count);
        const buf = gl.createBuffer();
        gl.bindBuffer(gl.ARRAY_BUFFER, buf);
        gl.bufferData(gl.ARRAY_BUFFER, data, gl.STATIC_DRAW);

        const seedLoc = gl.getAttribLocation(prog, 'seed');
        gl.enableVertexAttribArray(seedLoc);
        gl.vertexAttribPointer(seedLoc, 4, gl.FLOAT, false, 0, 0);

        gl.enable(gl.BLEND);
        gl.blendFunc(gl.ONE, gl.ONE);

        this.uniforms = {
          time: gl.getUniformLocation(prog, 'time'),
          pixels: gl.getUniformLocation(prog, 'pixels'),
          density: gl.getUniformLocation(prog, 'density'),
          onset: gl.getUniformLocation(prog, 'onset'),
          reduced: gl.getUniformLocation(prog, 'reduced'),
          weights: gl.getUniformLocation(prog, 'weights'),
          bands: gl.getUniformLocation(prog, 'bands'),
        };
        this.count = count;
      }

      startLoop() {
        const loop = (now) => {
          const dt = Math.min((now - this.last) / 1000, 0.05);
          this.last = now;
          this.time += dt;

          for (let i = 0; i < 4; i++) {
            this.weights[i] += (this.targetWeights[i] - this.weights[i]) * Math.min(1, dt * 6);
          }

          if (!this.analyser) {
            const t = this.time;
            const b = this.state === 'idle' ? 0.15 : this.state === 'listening' ? 0.5 : 0.8;
            this.bands[0] = b * (0.5 + 0.5 * Math.sin(t * 3.1));
            this.bands[1] = b * (0.5 + 0.5 * Math.cos(t * 4.7));
            this.bands[2] = b * (0.5 + 0.5 * Math.sin(t * 7.3));
            this.onset = Math.max(0, this.onset - dt * 2) + (Math.random() > 0.95 ? 0.4 : 0);
          } else {
            this.updateAudioAnalysis();
          }

          if (this.gl) {
            const gl = this.gl;
            gl.clearColor(0, 0, 0, 0);
            gl.clear(gl.COLOR_BUFFER_BIT);

            gl.uniform1f(this.uniforms.time, this.time);
            gl.uniform1f(this.uniforms.pixels, this.canvas.height);
            gl.uniform1f(this.uniforms.density, parseFloat(this.getAttribute('density') || '1.2'));
            gl.uniform1f(this.uniforms.onset, this.onset);
            gl.uniform1f(this.uniforms.reduced, 0);
            gl.uniform4fv(this.uniforms.weights, this.weights);
            gl.uniform3fv(this.uniforms.bands, this.bands);

            gl.drawArrays(gl.POINTS, 0, this.count);
          }

          this.frame = requestAnimationFrame(loop);
        };
        this.frame = requestAnimationFrame(loop);
      }

      async listenMic() {
        try {
          const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
          const ctx = new (window.AudioContext || window.webkitAudioContext)();
          const src = ctx.createMediaStreamSource(stream);
          const analyser = ctx.createAnalyser();
          analyser.fftSize = 512;
          src.connect(analyser);
          
          this.audioCtx = ctx;
          this.analyser = analyser;
          this.freqData = new Uint8Array(analyser.frequencyBinCount);
          this.state = 'listening';

          this.stopAudio = () => {
            stream.getTracks().forEach(t => t.stop());
            ctx.close();
            this.analyser = null;
          };
        } catch (e) {
          console.error("Mic access denied or error:", e);
          this.state = 'idle';
        }
      }

      updateAudioAnalysis() {
        if (!this.analyser) return;
        this.analyser.getByteFrequencyData(this.freqData);
        let bassSum = 0, midSum = 0, highSum = 0;
        const len = this.freqData.length;
        for (let i = 0; i < len; i++) {
          const v = this.freqData[i] / 255;
          if (i < len * 0.2) bassSum += v;
          else if (i < len * 0.6) midSum += v;
          else highSum += v;
        }
        this.bands[0] = bassSum / (len * 0.2);
        this.bands[1] = midSum / (len * 0.4);
        this.bands[2] = highSum / (len * 0.4);
        this.onset = Math.max(0, this.onset - 0.05) + (this.bands[0] > 0.6 ? 0.3 : 0);
      }
    }
    customElements.define('voice-orb', VoiceOrb);
  })();

  const orb = document.getElementById('orb');

  orb.onclick = async () => {
    if (orb.state === 'listening' && orb.analyser) {
      orb.stopAudio?.();
      orb.state = 'idle';
    } else {
      orb.state = 'thinking';
      await orb.listenMic();
    }
  };
  </script>

<script>
  (function () {
    var params = new URLSearchParams(location.search);
    var theme = params.get('theme') || '';
    function luminance(hex) {
      var h = String(hex || '').replace('#', '');
      if (h.length === 3) h = h[0] + h[0] + h[1] + h[1] + h[2] + h[2];
      if (h.length !== 6) return null;
      var c = [0, 2, 4].map(function (i) { return parseInt(h.substr(i, 2), 16) / 255; });
      return 0.2126 * c[0] + 0.7152 * c[1] + 0.0722 * c[2];
    }
    var accentLum = luminance(params.get('accent') || '');
    var light = theme === 'light' || theme === 'sunset' || (theme === 'custom' && (accentLum === null || accentLum > 0.55));
    var host = document.getElementById('voice-orb-canvas');
    if (!light) {
      if (host) host.style.setProperty('--cap-user', '#ffd6a8');
      return;
    }
    document.documentElement.style.setProperty('--ink', '#16241c');
    document.documentElement.style.setProperty('--mute', '#4b5a50');
    if (host) {
      host.style.setProperty('--cap', '#16241c');
      host.style.setProperty('--cap-user', '#8a4b12');
      host.style.setProperty('--cap-dim', 'rgba(22, 36, 28, .55)');
    }
  })();
</script>
</body>
</html>
