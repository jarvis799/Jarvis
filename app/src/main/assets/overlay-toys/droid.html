<!DOCTYPE html>
<html lang="en" style="background:transparent">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Droid avatar</title>
<style>
  html, body { height:100%; margin:0; }
  body { display:flex; align-items:center; justify-content:center; background:transparent; font-family:system-ui,-apple-system,"Segoe UI",sans-serif; touch-action:manipulation; }
  #root { display:flex; flex-direction:column; align-items:center; gap:16px; }
</style>
</head>
<body>
<div id="root"></div>

<script src="../vendor/react.umd.js"></script>
<script src="../vendor/react-dom.umd.js"></script>
<script src="../vendor/bot-avatars.js"></script>
<script>
  
  // Real mouse hover ko library tak jaane se rokte hain (isTrusted = asli input).
  // Sirf hamare banaye hue (synthetic) move events pass honge.
  for (const t of ["pointermove", "mousemove", "mouseover", "touchmove"])
    window.addEventListener(t, e => { if (e.isTrusted) e.stopImmediatePropagation(); }, true);

  // Tap hone par: pehle usi point par ek synthetic pointermove bhejo,
  // phir asli tap library tak jaata hai. Isse library khud accurately
  // tap ki taraf dekhti hai aur ghost par tap karne se hop bhi karta hai.
  window.addEventListener("pointerdown", e => {
    if (!e.isTrusted) return;
    window.dispatchEvent(new PointerEvent("pointermove", {
      clientX: e.clientX, clientY: e.clientY,
      pointerId: e.pointerId, pointerType: e.pointerType, isPrimary: true,
      bubbles: true, cancelable: true
    }));
    const el = document.elementFromPoint(e.clientX, e.clientY);
    if (el) el.dispatchEvent(new PointerEvent("pointermove", {
      clientX: e.clientX, clientY: e.clientY,
      pointerId: e.pointerId, pointerType: e.pointerType, isPrimary: true,
      bubbles: true, cancelable: true
    }));
  }, true);

  try {
    
    const { createRoot } = ReactDOM;
    const { BotAvatar } = window.BotAvatars;
    const { createElement: h } = React;

    createRoot(document.getElementById("root")).render(
      h(BotAvatar, { type: "droid", face: "mouth", size: 64, shading: "fabric", interactive: true })
    );
  } catch (e) {
    document.getElementById("root").textContent = "Load failed: " + e.message + " (internet check karo)";
  }
</script>
</body>
</html>
