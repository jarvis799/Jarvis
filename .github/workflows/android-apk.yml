# Builds the JARVIS Android app and uploads the signed release APK as a direct download release asset.
# The Gradle wrapper (Gradle 8.9, AGP 8.7.2, Kotlin 2.0.20, Java 17) drives the build.

name: DEV STYLE — JARVIS Android APK

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: jarvis-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug-apk:
    name: Build release APK
    runs-on: ubuntu-latest

    env:
      # Creator key comes from a repository variable, never from committed source.
      JARVIS_CREATOR_KEY: ${{ vars.JARVIS_CREATOR_KEY }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify the packaged wake recognizer on real PCM
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y espeak-ng ffmpeg
          python3 -m pip install vosk==0.3.45
          python3 tools/wake_acoustic_probe.py

      - name: Set up JDK 17 (required by AGP 8.7 / Kotlin 2.0)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK and command-line tools
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false

      - name: Install pinned offline inference build tools
        run: sdkmanager --install "platforms;android-34" "build-tools;34.0.0" "ndk;27.0.12077973" "cmake;3.22.1"

      # Android SDK 34 is preinstalled on ubuntu-latest runners; ANDROID_HOME is set automatically.
      - name: Set up Gradle caching (wrapper 8.9)
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Grant execute permission to gradlew
        run: chmod +x gradlew

      - name: Compile and test native changes
        run: |
          set -o pipefail
          ./gradlew :app:compileDebugKotlin :app:processDebugResources :app:testDebugUnitTest --stacktrace 2>&1 | tee gradle_output.log

      - name: Show Kotlin compile errors
        if: failure()
        run: 'grep -E "e: file|error:|FAILURE" gradle_output.log | head -80 || true'

      - name: Upload gradle log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-output-log
          path: gradle_output.log
          if-no-files-found: error

      - name: Restore the permanent signing key
        uses: ./.github/actions/jarvis-signing
        with:
          keystore-base64: ${{ secrets.JARVIS_RELEASE_KEYSTORE_BASE64 }}
          store-password: ${{ secrets.JARVIS_RELEASE_STORE_PASSWORD }}
          key-alias: ${{ secrets.JARVIS_RELEASE_KEY_ALIAS }}
          key-password: ${{ secrets.JARVIS_RELEASE_KEY_PASSWORD }}
          certificate-sha256: ${{ secrets.JARVIS_RELEASE_CERT_SHA256 }}

      - name: Build release APK with the Gradle wrapper (:app assembleRelease)
        id: build_release
        run: ./gradlew :app:assembleRelease --stacktrace --warning-mode all

      - name: Verify the APK was produced
        run: |
          APK_COUNT=$(find app/build/outputs/apk -type f -name '*.apk' | wc -l)
          echo "Found $APK_COUNT APK file(s) under app/build/outputs/apk"
          if [ "$APK_COUNT" -eq 0 ]; then
            echo "::error::No APK was produced. Check the Gradle build logs above."
            exit 1
          fi
          find app/build/outputs/apk -type f -name '*.apk' -exec ls -lh {} \;

      - name: Verify offline engine is inside the APK
        run: |
          APK=$(find app/build/outputs/apk -type f -name '*.apk' -print -quit)
          unzip -l "$APK" | grep 'lib/arm64-v8a/libjarvis_llama.so'
          unzip -l "$APK" | grep 'lib/x86_64/libjarvis_llama.so'

      - name: Upload debug APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Jarvis-release-apk
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Verify the APK signature
        if: success()
        run: |
          set -euo pipefail
          APK=$(find app/build/outputs/apk -type f -name '*.apk' -print -quit)
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* 2>/dev/null | sort -V | tail -1)
          if [ -z "$BT" ]; then BT=/usr/local/lib/android/sdk/build-tools/34.0.0; fi
          "$BT/apksigner" verify --print-certs "$APK" | tee apk-cert.txt
          echo "Signing certificate SHA-256 printed above."

      - name: Show the APK checksum
        if: success()
        run: |
          APK=$(find app/build/outputs/apk -type f -name '*.apk' -print -quit)
          echo "APK: $APK"
          sha256sum "$APK" | tee apk-sha256.txt

      # Runtime Feature Updates reads this asset from the newest release. Without it
      # the app could not find any feature list at all, so the screen always failed.
      - name: Prepare the runtime feature manifest
        if: success() && github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          if [ -f feature-manifest.json ]; then
            echo "Using the committed feature-manifest.json"
          else
            printf '{"format_version":1,"features":[]}\n' > feature-manifest.json
            echo "No feature packs yet - publishing an empty manifest."
          fi

      # The artifact download is a .zip that some Android file managers cannot unpack.
      # A release asset gives a direct .apk download (no zip, no unzip step).
      - name: Publish a direct APK download
        if: success() && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          APK=$(find app/build/outputs/apk -type f -name '*.apk' -print -quit)
          # Read the single source of truth: versionName in app/build.gradle.kts.
          VERSION=$(grep -m1 'versionName' app/build.gradle.kts | sed 's/.*"\(.*\)".*/\1/')
          if [ -z "$VERSION" ]; then echo "Could not read versionName"; exit 1; fi
          NAME="Jarvis-V$VERSION.apk"
          NOTES="Direct install: download the .apk asset below - there is no zip to unpack. Built with :app:assembleRelease and signed with the permanent release key. SHA-256 attached as apk-sha256.txt."
          echo "Publishing $NAME"
          cp "$APK" "$NAME"
          # This repo publishes immutable releases: once a release exists, its assets
          # cannot be added or replaced (HTTP 422 "immutable release"). So assets must
          # be attached AT create time (before the release is locked), and we never
          # clobber an existing tag. Retries handle transient 404/502 from GitHub.
          publish_new() {
            local tag="$1"; local title="$2"
            for attempt in 1 2 3 4 5; do
              if gh release create "$tag" "$NAME" apk-sha256.txt apk-cert.txt feature-manifest.json \
                  --target "${GITHUB_SHA}" --title "$title" --notes "$NOTES"; then
                return 0
              fi
              echo "Create-with-assets attempt $attempt for $tag failed; cleaning up and retrying in 10s..."
              gh release delete "$tag" --yes --cleanup-tag 2>/dev/null || true
              sleep 10
            done
            return 1
          }
          TAG="v$VERSION"
          TITLE="Jarvis V$VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists (immutable) - publishing under a build tag"
            TAG="v$VERSION-build.$GITHUB_RUN_NUMBER"
            TITLE="Jarvis V$VERSION (build $GITHUB_RUN_NUMBER)"
          fi
          if ! publish_new "$TAG" "$TITLE"; then
            echo "Publish under $TAG failed - retrying with a unique build tag"
            TAG="v$VERSION-build.$GITHUB_RUN_NUMBER-$$"
            TITLE="Jarvis V$VERSION (build $GITHUB_RUN_NUMBER)"
            publish_new "$TAG" "$TITLE"
          fi
          echo "Direct download: https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${NAME}"