name: Build Jarvis APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Compile and test native changes
        run: chmod +x gradlew && ./gradlew :app:compileDebugKotlin :app:processDebugResources :app:testDebugUnitTest --stacktrace

      - name: Restore the permanent signing key
        uses: ./.github/actions/jarvis-signing
        with:
          keystore-base64: ${{ secrets.JARVIS_RELEASE_KEYSTORE_BASE64 }}
          store-password: ${{ secrets.JARVIS_RELEASE_STORE_PASSWORD }}
          key-alias: ${{ secrets.JARVIS_RELEASE_KEY_ALIAS }}
          key-password: ${{ secrets.JARVIS_RELEASE_KEY_PASSWORD }}
          certificate-sha256: ${{ secrets.JARVIS_RELEASE_CERT_SHA256 }}

      - name: Build Debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Jarvis-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
